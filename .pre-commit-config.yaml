repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: sqlfluff-lint
        name: sqlfluff lint (dbt models)
        entry: uv run sqlfluff lint dbt/models
        language: system
        files: ^dbt/models/.*\.sql$
        pass_filenames: false
